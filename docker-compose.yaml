services:
  base_arm: 
    build: 
      context: .
      dockerfile: .docker_utils/Dockerfile.base_arm
    image: base_arm
  
  sim_arm:
    build:
      context: .
      dockerfile: .docker_utils/Dockerfile.sim_arm
      args:
        - USER=${USER} 
        - UID=${UID} # user id must be saved to an environment variable, can be done with `export UID=$(id -u)`
        - GID=${GID} # group id must be saved to an environment variable, can be done with `export GID=$(id -g)`
    image: race_stack_sim_arm
    depends_on:
      - base_arm

  jet:
    build:
      context: .
      dockerfile: .docker_utils/Dockerfile.jet
      args:
        - USER=${USER} 
        - UID=${UID} # user id must be saved to an environment variable, can be done with `export UID=$(id -u)`
        - GID=${GID} # group id must be saved to an environment variable, can be done with `export GID=$(id -g)`
    image: race_stack_jet
    depends_on:
      - base_arm

  base_x86: 
    build: 
      context: .
      dockerfile: .docker_utils/Dockerfile.base_x86
    image: base_x86
    
  base_x86_2nd_car: 
    build: 
      context: .
      dockerfile: .docker_utils/Dockerfile.base_x86
    image: base_x86_2nd_car

  sim_x86:
    build:
      context: .
      dockerfile: .docker_utils/Dockerfile.sim_x86
      args:
        - USER=${USER} 
        - UID=${UID} # user id must be saved to an environment variable, can be done with `export UID=$(id -u)`
        - GID=${GID} # group id must be saved to an environment variable, can be done with `export GID=$(id -g)`
    image: race_stack_sim_x86
    # container_name: race_stack_sim_x86
    depends_on:
      - base_x86

  nuc:
    build:
      context: .
      dockerfile: .docker_utils/Dockerfile.nuc
      args:
        - USER=${USER} 
        - UID=${UID} # user id must be saved to an environment variable, can be done with `export UID=$(id -u)`
        - GID=${GID} # group id must be saved to an environment variable, can be done with `export GID=$(id -g)`
    image: race_stack_nuc
    depends_on:
      - base_x86
      
  nuc_2nd_car:
    build:
      context: .
      dockerfile: .docker_utils/Dockerfile.nuc
      args:
        - USER=${USER}
        - UID=${UID} # user id must be saved to an environment variable, can be done with `export UID=$(id -u)`
        - GID=${GID} # group id must be saved to an environment variable, can be done with `export GID=$(id -g)`
    image: race_stack_nuc_2nd_car
    depends_on:
      - base_x86_2nd_car

  # SH: state_machine 검증 전용 minimal 이미지 (GLIL/Cartographer/Livox 제외).
  # base_x86 의존 없음 — ros:noetic-robot 에서 직접 빌드.
  sim_sh_x86:
    build:
      context: .
      dockerfile: .docker_utils/Dockerfile.sim_sh.x86
      args:
        - USER=${USER}
        - UID=${UID}
        - GID=${GID}
    image: race_stack_sim_sh